# Premium care diary for Italian family caregivers, by Dario Neri.
#
# The incumbent is a daily logbook that tracks only the person being cared for.
# This one keeps that record and adds the caregiver's own: hours of care each
# week, leave used, expenses with their receipts, the verbali that open the
# rights, and a line a day for the person who does the caring. Evidence below
# comes from the Amazon.it search export and the trend scan of 12 October 2026.
niche: "Diario del caregiver familiare"
book_type: logbook

audience: "familiari che assistono a casa un genitore, un coniuge o un figlio non autosufficiente, spesso mentre lavorano"
audience_short: "caregiver familiari"
title: "Il Diario del Caregiver Familiare"
subtitle: "Registro giornaliero di farmaci, sintomi e parametri vitali, con le ore di assistenza, i permessi e le spese da conservare"
promise: "Tutto ciò che serve ricordare della cura, e di chi cura, in cinque minuti al giorno."

