# Daily run of the football value-pick agent (football_ev_engine/).
#
# Secrets to add under Settings -> Secrets and variables -> Actions:
#   ODDS_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, and optionally ANTHROPIC_API_KEY.
#
# The DuckDB file (history, sent picks for dedup, track record) is carried
# between runs in the Actions cache. GitHub evicts caches unused for 7 days,
# so if the workflow is paused for longer the pick history starts afresh.
name: Football value agent

on:
  schedule:
    # GitHub often starts scheduled runs late (or drops them) at the top of the
    # hour, so the main run sits at :41. The two backups do nothing, and cost no
    # credits, once the day's run has completed.
    - cron: "41 7 * * *"   # 09:41 Rome in summer (08:41 in winter)
    - cron: "23 9 * * *"   # backup
    - cron: "7 11 * * *"   # backup
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: run
        options:
          - run       # send today's picks (runs again even if today's run already happened)
          - dry-run   # compute and show picks, send nothing
          - report    # send the summary + CSV history to Telegram

concurrency:
  group: football-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: football_ev_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: football_ev_engine/requirements.txt

      - run: pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: football_ev_engine/data
          key: football-agent-db-${{ github.run_id }}
          restore-keys: football-agent-db-

      - name: Run agent
        run: |
          case "${{ github.event_name }}:${{ inputs.mode }}" in
            workflow_dispatch:dry-run) python main.py agent run --dry-run ;;
            workflow_dispatch:report)  python main.py agent report --send ;;
            workflow_dispatch:*)       python main.py agent run --force ;;
            *)                         python main.py agent run ;;
          esac
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COLUMNS: "160"

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: football_ev_engine/data
          key: football-agent-db-${{ github.run_id }}
