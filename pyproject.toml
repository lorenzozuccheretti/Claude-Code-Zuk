[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kdp-factory"
version = "0.1.0"
description = "A repeatable engine that builds print-ready KDP books: six stations, three blocking gates."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "reportlab>=4.0",
    "pypdf>=3.17",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
upload = ["playwright>=1.40"]
llm = ["anthropic>=0.40"]
# KDP-Intelligence-Engine (kdp_intel): agents, RAG and typesetting for non-fiction.
intel = [
    "anthropic>=1.0",
    "langgraph>=1.0",
    "chromadb>=1.0",
    "typst>=0.13",
    "weasyprint>=62",
    "httpx>=0.27",
    "pydantic>=2.7",
]
pinecone = ["pinecone>=5.0"]
embeddings = ["sentence-transformers>=3.0"]
dev = ["pytest>=7.4"]

[project.scripts]
kdp = "kdp_factory.cli:main"
kdpi = "kdp_intel.cli:main"

[tool.setuptools.packages.find]
include = ["kdp_factory*", "kdp_intel*"]

[tool.setuptools.package-data]
"kdp_factory" = [
    "spec/*.yaml",
    "content/templates/*.yaml",
    "upload/*.yaml",
    "assets/fonts/*.ttf",
    "assets/fonts/OFL.txt",
]
"kdp_intel" = ["typeset/templates/*.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
