# The KDP spec card — every number the engine is not allowed to guess.
#
# Retailer specs change. This file is the single place they live so that a
# change is a one-line edit, not a hunt through the renderers.
spec_version: "2026.02"
last_verified: "2026-02-01"
source: "https://kdp.amazon.com/en_US/help/topic/G201834180 (print options & trim sizes)"
marketplace: "amazon.com"
currency: "USD"

# Spine width = page_count * thickness_in_per_page. Never estimated.
paper_thickness_in_per_page:
  bw_white: 0.002252
  bw_cream: 0.0025
  standard_color: 0.002252
  premium_color: 0.002347

page_count:
  min: 24
  max_by_paper:
    bw_white: 828
    bw_cream: 776
    standard_color: 828
    premium_color: 600
  # Printed books are made of leaves: an odd page count is a spec violation.
  must_be_even: true

bleed_in: 0.125

# Inside (gutter) margin grows with the page count, because thicker books
# swallow more of the inner edge in the binding.
gutter_margin_in:
  - { max_pages: 150, margin: 0.375 }
  - { max_pages: 300, margin: 0.500 }
  - { max_pages: 500, margin: 0.625 }
  - { max_pages: 700, margin: 0.750 }
  - { max_pages: 828, margin: 0.875 }

outside_margin_in:
  no_bleed: 0.25
  with_bleed: 0.375

cover:
  safe_margin_in: 0.25          # keep live text this far inside the trim
  spine_text_min_pages: 100     # below this KDP rejects text on the spine
  spine_text_safe_in: 0.0625    # clearance each side of spine text
  barcode_keepout_in: { width: 2.0, height: 1.2 }
  barcode_offset_in: { from_bottom_trim: 0.25, from_spine_edge: 0.25 }
  min_dpi: 300

# Printing cost (US marketplace, 60% royalty plan).
printing_cost:
  low_page_threshold: 108
  plans:
    bw_white:      { low_fixed: 2.30, fixed: 1.00, per_page: 0.012 }
    bw_cream:      { low_fixed: 2.30, fixed: 1.00, per_page: 0.012 }
    standard_color: { low_fixed: 3.60, fixed: 0.85, per_page: 0.0425 }
    premium_color: { low_fixed: null, fixed: 0.85, per_page: 0.0585 }

royalty:
  standard_rate: 0.60
  expanded_rate: 0.40
  price_rounding_step: 0.01

listing_limits:
  title_chars: 200
  subtitle_chars: 200
  title_plus_subtitle_chars: 200
  description_chars: 4000
  keyword_slots: 7
  keyword_chars: 50
  categories: 3
  author_name_chars: 50

trim_sizes_in:
  - { name: "5x8",        width: 5.00,  height: 8.00 }
  - { name: "5.25x8",     width: 5.25,  height: 8.00 }
  - { name: "5.5x8.5",    width: 5.50,  height: 8.50 }
  - { name: "6x9",        width: 6.00,  height: 9.00 }
  - { name: "6.14x9.21",  width: 6.14,  height: 9.21 }
  - { name: "6.69x9.61",  width: 6.69,  height: 9.61 }
  - { name: "7x10",       width: 7.00,  height: 10.00 }
  - { name: "7.44x9.69",  width: 7.44,  height: 9.69 }
  - { name: "7.5x9.25",   width: 7.50,  height: 9.25 }
  - { name: "8x10",       width: 8.00,  height: 10.00 }
  - { name: "8.25x8.25",  width: 8.25,  height: 8.25 }
  - { name: "8.5x8.5",    width: 8.50,  height: 8.50 }
  - { name: "8.5x11",     width: 8.50,  height: 11.00 }
