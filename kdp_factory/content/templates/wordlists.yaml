# Themed word lists for puzzle books.
#
# Words are placed into a square grid, so anything with spaces, hyphens or
# accents is normalised to A-Z before placement. Keep each theme at 20 words or
# more: when a book needs more puzzles than there are themes, the generator
# reuses a theme only with a DISJOINT slice of its words, so no two puzzles in
# the same book share a word list.
