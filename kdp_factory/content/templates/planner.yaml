  - "What would make the rest of the month lighter if you did it now?"
  - "Which task have you been researching instead of doing?"
  - "What are you afraid this week will cost you?"
  - "One thing that would still matter in a year."
  - "What are you keeping in your head that belongs on paper?"
  - "Which appointment sets the shape of the whole week?"
  - "Where could you be kinder to yourself without doing less?"
  - "The thing you keep rewriting. Send it."
  - "What is the one number that tells you this week worked?"
  - "Which corner of your work has gone quiet and shouldn't have?"
  - "What are you doing on autopilot that deserves a second look?"
  - "Name the week's one irreversible decision."
  - "What could you prepare today that saves an hour on Thursday?"
  - "Which of these tasks is really three tasks?"
  - "What will you do with the first clear hour you get?"
  - "The thing you would start if you knew it would go well."
  - "What are you tolerating that you could fix in an afternoon?"
  - "Which commitment has outlived its reason?"
  - "What would you like to stop explaining?"
  - "Name the one thing you will not check on your day off."
  - "What could go wrong that nobody is watching for?"
  - "Which piece of this is genuinely other people's to solve?"
  - "What have you been meaning to read, and when will you?"
  - "The email that needs two lines, not two paragraphs."
  - "What would make this week repeatable?"
  - "Which task will you be glad to see crossed off on Friday?"
  - "What are you building toward that this week feeds?"
