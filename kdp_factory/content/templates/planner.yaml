  - "Which habit is carrying you this week, and which is costing you?"
  - "What would you delegate if you trusted it would be done?"
  - "The conversation you are avoiding. When will you have it?"
  - "What does a good week look like from Sunday evening, looking back?"
  - "Which deadline is real and which one did you invent?"
  - "What are you optimistic about, and is the optimism scheduled?"
