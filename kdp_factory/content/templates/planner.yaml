review_questions:
  - "What went well?"
  - "What got in the way?"
  - "What carries over?"
  - "One thing to change next week"

  - "What surprised you?"
  - "Where did the time actually go?"
  - "What would you do again without thinking?"
  - "What did you say yes to and regret?"
  - "Which promise did you keep to yourself?"
  - "What is worth repeating next week?"
day_names: [Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]

month_names: [January, February, March, April, May, June, July, August, September, October, November, December]

how_to_use:
  - "Start on any Monday. The weeks are undated on purpose so a skipped week costs you nothing."
  - "Fill the focus line before the to-do list. The list is easier when the week has a point."
  - "Tick the habit boxes at the same time each day — the evening works better than the morning."
  - "The review section at the end of each week takes two minutes and is the part that compounds."

closing_lines:
  - "That is the last week in this book. Read the focus lines back — that was your year, in one line a week."
