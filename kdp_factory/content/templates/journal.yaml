how_to_use:
- One page a day. Keep it short and keep it honest — three lines you mean beat a page you performed.
- Write at the same time each day if you can. The habit does more work than the words.
- If a prompt does not fit today, answer the one underneath it instead. Nothing here is graded.
- Dates are left blank on purpose. Start on any day and skip days without ruining the book.
closing_lines:
- That is the last page. Look back at the first one — you were a different person writing it.
- You filled a book. Keep it somewhere you will find it again in a year.
