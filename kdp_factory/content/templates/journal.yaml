    - What is a compliment you received that you still think about?
    - Which habit is currently doing the most work for you?
    - Write about a time you changed your mind about something.
    - What would you tell yourself at the start of this week?
    - Name three sounds you would be sad to never hear again.
    - What is something you have been putting off that would take ten minutes?
