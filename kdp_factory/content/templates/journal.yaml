    - Name something you have kept long after it stopped being useful.
    - What does your evening look like when nobody needs anything?
    - Which compliment would you find hardest to believe?
    - What have you been meaning to ask someone?
    - Describe the last thing that made you stop walking.
    - What is a habit of yours that you would not recommend?
    - Which decision would you make faster if you trusted yourself more?
    - What is taking up room in your head that you did not invite?
