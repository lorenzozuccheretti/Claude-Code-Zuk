    - What is the most useful thing you have thrown away?
    - Which relationship in your life takes the least effort, and why?
    - What is the story you tell most often about yourself?
    - Describe the last time you changed your mind in the middle of an argument.
    - What do you notice first when you walk into someone else's home?
    - Which task do you do carefully even though nobody checks?
    - What did you want to be, and what did that actually mean?
    - Write about a book, film or song you return to.
    - What have you stopped apologising for?
    - Which part of the day belongs to you alone?
    - What would make tomorrow easier that you could do tonight?
    - Name a promise you kept to yourself recently.
    - What do you find beautiful that most people walk past?
    - Write about a time you were braver than you expected.
    - What are you curious about lately, with no purpose attached?
    - Which habit did you drop without noticing, and do you miss it?
    - What is something you say yes to too quickly?
    - Describe the sound of your home on a normal evening.
    - What is worth doing badly, in your opinion?
    - Who taught you something without meaning to?
    - What does your handwriting look like when you are in a hurry?
    - Write about the last thing you fixed rather than replaced.
    - What are you looking forward to that is entirely ordinary?
    - 'Think of someone you saw today: what did their face tell you?'
    - Who did you think about today without meaning to?
    - Describe a room you spent time in today, and what it did to your mood.
    - What is one thing about a person close to you that you would not want to forget?
    - Which choice did you almost make differently today?
    - Who has been on your mind all week, and have you told them?
    - What did you carry into today that belonged to yesterday?
    - What would you like to be told today by someone who knows you well?
    - Name a thing you are good at that never shows up on a CV.
    - What did you spend money on this week that you would spend again?
    - Which task took less time than the dread it caused?
    - What have you outgrown but not yet put down?
    - When did someone last give you more time than you asked for?
    - What is the first thing you notice when you wake up?
    - Which season of your life does this one rhyme with?
    - What do you keep in a drawer you never open?
    - Name something you are willing to be bad at.
    - What did you learn this month that you have not used yet?
    - Which door in your home do you keep closed, and why?
    - What is the kindest thing you did for yourself this week?
